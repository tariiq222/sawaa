approval_policy = "never"
sandbox_mode = "danger-full-access"
[mcp_servers.chrome-devtools]
args = [
    "-y",
    "chrome-devtools-mcp@latest",
]
command = "npx"

[mcp_servers.postgres]
enabled = false
args = [
    "-y",
    "@modelcontextprotocol/server-postgres",
    "postgresql://deqah:deqah_dev_password@localhost:5999/deqah_dev",
]
command = "npx"

[features]
apps = false
remote_plugin = false

[mcp_servers.playwright-test-local]
command = "node"
args = ["e2e/playwright/run-mcp.mjs"]

[mcp_servers.jev-review]
enabled = true
command = "/Users/tariq/.local/bin/node"
args = ["/Users/tariq/code/sawaa/scripts/mcp/jev-review.cjs"]
startup_timeout_sec = 20
tool_timeout_sec = 45
