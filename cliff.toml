# Shared configuration for local previews and automatic GitHub changelogs.
[changelog]
header = """
# سجل تغييرات سواء

يُولّد هذا السجل من الكومِتات الموجودة في الفرع المحدد. أرقام الإصدارات هي وسوم للكود؛ لا تثبت نجاح النشر.

توثيق النشر منفصل في [سجل العمليات](https://github.com/tariiq222/sawaa/blob/main/docs/operations/current-state.md).

"""
body = """
{% if version %}
## {{ version }} — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}
## تغييرات لم تدخل إصدارًا موسومًا بعد
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first }}{% if commit.breaking %} **(تغيير غير متوافق)**{% endif %} ([{{ commit.id | truncate(length=9, end="") }}](https://github.com/tariiq222/sawaa/commit/{{ commit.id }}))
{% endfor %}
{% endfor %}

"""
trim = true
format = true

[git]
conventional_commits = true
# Preserve older Arabic and non-conventional subjects rather than lose changes.
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
commit_parsers = [
  # The commits introduced by a merge are already listed individually.
  { field = "merge_commit", pattern = "true", skip = true },
  { message = "^chore\\(changelog\\)", skip = true },
  { message = "^feat", group = "ميزات جديدة" },
  { message = "^fix", group = "إصلاحات" },
  { message = "^perf", group = "تحسين الأداء" },
  { message = "^refactor", group = "تحسينات داخلية" },
  { message = "^docs?", group = "توثيق" },
  { message = "^test", group = "اختبارات" },
  { message = "^(build|ci)", group = "البناء والأتمتة" },
  { message = "^deps", group = "تحديث الاعتماديات" },
  { message = "^revert", group = "تراجع عن تغييرات" },
  { message = "^chore", group = "صيانة" },
  { message = ".*", group = "تغييرات أخرى" },
]
# Matches the code-release tags produced by scripts/tag-release.mjs.
tag_pattern = '^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$'
topo_order = true
sort_commits = "newest"
