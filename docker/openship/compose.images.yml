# Run prebuilt GHCR images instead of building on the OpenShip host.
# Use together with compose.yml:
#   docker compose -f compose.yml -f compose.images.yml up -d
# The image tags come from the build-images workflow and are passed through
# POSTGRES_IMAGE, BACKEND_IMAGE, DASHBOARD_IMAGE and WEBSITE_IMAGE, for example
#   BACKEND_IMAGE=ghcr.io/tariiq222/sawaa-backend:staging-<full commit sha>
# There are no defaults on purpose: an unset variable must fail, never fall back
# to a locally built or stale image.
services:
  postgres:
    build: !reset null
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE is required}
    pull_policy: always

  backend:
    build: !reset null
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    pull_policy: always

  dashboard:
    build: !reset null
    image: ${DASHBOARD_IMAGE:?DASHBOARD_IMAGE is required}
    pull_policy: always

  website:
    build: !reset null
    image: ${WEBSITE_IMAGE:?WEBSITE_IMAGE is required}
    pull_policy: always
