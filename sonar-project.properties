# SonarQube Community Build — Sawa monorepo.
# Run from the repository root after generating fresh coverage reports:
#   pnpm --filter=backend run test:cov
#   pnpm --filter=dashboard run test:cov
#   pnpm --filter=website run test:cov
#   export SONAR_TOKEN=<token from SonarQube account/security>
#   sonar-scanner
# Never store the token in this file or pass it on a visible command line.
# Override the host with SONAR_HOST_URL for a different instance.
sonar.projectKey=sawaa
sonar.projectName=Sawa
sonar.sourceEncoding=UTF-8
sonar.host.url=http://localhost:9000

# Match the previously successful analysis scope. Tests are excluded rather
# than silently counted as production security issues. A separate, deliberately
# scoped test analysis can be added when its performance is established.
sonar.sources=apps,packages,scripts
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/test-results/**,**/outputs/**

# The JavaScript/TypeScript bridge exceeded its default memory on this monorepo.
sonar.javascript.node.maxspace=4096

# Import only after regenerating reports; local coverage files are gitignored
# and may be stale. No report path is enabled by default for that reason.
# Example for a verified fresh report (pass on the scanner command line):
#   -Dsonar.javascript.lcov.reportPaths=apps/backend/coverage/lcov.info,apps/dashboard/coverage/lcov.info
