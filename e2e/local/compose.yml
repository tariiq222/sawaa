services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?}
      POSTGRES_DB: ${LOCAL_DB_NAME:?}
    ports: ["127.0.0.1:55761:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2e -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:55762:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    command: server /data
    environment:
      MINIO_ROOT_USER: e2e-local
      MINIO_ROOT_PASSWORD: ${LOCAL_MINIO_PASSWORD:?}
    ports: ["127.0.0.1:55763:9000"]
    volumes: ["minio:/data"]
volumes:
  postgres:
  minio:
networks:
  default:
    ipam:
      config:
        - subnet: 10.247.163.0/24
