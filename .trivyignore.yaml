# Explicit YAML policy for CI; .trivyignore retains the prior legacy policy.
vulnerabilities:
  # Owner approved 2026-10-31; extended by the owner on 2026-11-12 (MNT-07,
  # option A) to 2027-03-31 UTC after a reachability review:
  # the only consumers are minio@8.0.7 (backend, latest release) and
  # expo-router@55 (mobile), both through query-string@7.1.3, and both call
  # query-string `stringify` only. decode-uri-component is used by `parse`,
  # so the vulnerable decoder is not reached. Re-check when minio or
  # expo-router ship a release that drops query-string 7.
  # 0.5.1 is ESM-only; query-string 7 requires this package from CommonJS.
  # The local patch carries the bounded single-pass decoder, so the fallback no
  # longer runs a full-string regular-expression replace per percent run.
  # Patch SHA-256: 0d0e80a6c28f2c4ad80ebac5ad3a5a3e35edd8117beb531359179675072dbdbe
  # scripts/security/dependency-fixes.test.cjs covers the malformed-run timing.
  - id: CVE-2026-118664
    paths:
      - pnpm-lock.yaml
      - apps/mobile/pnpm-lock.yaml
    purls:
      - pkg:npm/decode-uri-component@0.2.2
    expired_at: 2027-03-31
    statement: >-
      decode-uri-component 0.2.2 is locally patched with the bounded single-pass
      decoder, and the vulnerable decoder is unreachable: minio and
      expo-router only call query-string stringify. Remove when query-string
      no longer needs the CommonJS 0.2.x export or a fixed CommonJS release is
      installed; do not extend this exception without owner approval.
