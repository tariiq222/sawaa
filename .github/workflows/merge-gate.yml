# Additional merge checks. This job does not aggregate the separate CI jobs.
# Require CI jobs separately in branch protection; see docs/operations/current-state.md.
# The Git ancestry check is not proof of a deployed or manually accepted revision.

name: merge-gate

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

# Cancel in-progress runs when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # gate — additional checks alongside the separate CI workflow.
  # ─────────────────────────────────────────────────────────────────────
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    # `edited` is included so a PR retargeted to develop/main gets a fresh
    # gate. Every edit reruns the full gate on purpose: a skipped job would
    # report success and could mask an earlier failure on the same SHA.

    env:
      # Backend unit tests + openapi:build-and-snapshot both load AppModule,
      # which Joi-validates all of these at boot. Without them the gate
      # fails with "Config validation error: DATABASE_URL is required..."
      DATABASE_URL: postgresql://test:test@localhost:5432/sawaa_test?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      JWT_ACCESS_SECRET: ci-jwt-access-secret-32chars-long
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret-32chars-long
      JWT_OTP_SECRET: ci-jwt-otp-secret-32chars-long
      JWT_CLIENT_ACCESS_SECRET: ci-jwt-client-access-secret-32chars
      CHAT_GUEST_TOKEN_SECRET: ci-chat-guest-token-secret-32chars-long
      JWT_SMS_OTP_SECRET: ci-jwt-sms-otp-secret-32chars-long
      MOYASAR_ENCRYPTION_KEY: svR0uFV6QvUvZYb+qeN6cKdfMulWc3cNPkhW1QSFW5o=
      AI_PROVIDER_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      SMS_PROVIDER_ENCRYPTION_KEY: ktgFYAKoiqfCHgScsElAu72XXxolr6nPni3dH4Tjqos=
      ZOOM_PROVIDER_ENCRYPTION_KEY: Ac3BvEGKOIKvEvt398pj1yM8HisiuWx/mbXw1qSL0T8=
      EMAIL_PROVIDER_ENCRYPTION_KEY: +9ndIAOzLtT3MOlBXHPF76mLdx7ADTcm+2kDT7F5VcM=
      AUTHENTICA_API_KEY: ci-authentica-key
      MINIO_ENDPOINT: localhost
      MINIO_PORT: '9000'
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: sawaa-test
      MINIO_USE_SSL: 'false'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        # Dashboard + api-client resolve @sawaa/shared via its built
        # CJS entry. Without this, typecheck fails with
        # "Cannot find module '@sawaa/shared/...'" in dashboard,
        # api-client, and the openapi snapshot step.
        run: pnpm --filter @sawaa/shared --filter @sawaa/api-client build

      - name: Deploy-state regression tests
        run: node --test scripts/check-deploy-state.test.mjs

      - name: Staging OTP relay recipient boundary
        run: node --test docker/openship/otp-relay.test.mjs

      - name: Deploy-state consistency
        # Verifies that the candidate merge target is at-or-after the
        # latest tagged code release on main; does not verify deployment. Catches the
        # stale/divergent candidate scenario where develop was
        # force-pushed or someone re-targeted a stale PR.
        run: node scripts/check-deploy-state.mjs origin/main HEAD

      - name: Backend — unit
        run: pnpm --filter backend test

      - name: Dashboard — typecheck + unit
        run: pnpm --filter dashboard typecheck && pnpm --filter dashboard test -- --run

      - name: Website — typecheck + unit
        run: pnpm --filter @sawaa/website typecheck && pnpm --filter @sawaa/website test -- --run

      - name: Install mobile workspace dependencies
        working-directory: apps/mobile
        run: pnpm install --frozen-lockfile

      - name: Dependency security regression tests (root and mobile)
        run: SAWAA_INCLUDE_MOBILE_DEPENDENCIES=1 node --test scripts/security/dependency-fixes.test.cjs scripts/security/refresh-dependency-fixes.test.cjs

      - name: Mobile — build shared package + typecheck
        working-directory: apps/mobile
        run: pnpm --filter=@sawaa/shared build && pnpm typecheck

      - name: Mobile — lint
        working-directory: apps/mobile
        run: pnpm lint

      # `pnpm test` runs jest with --coverage, so the coverageThreshold block in
      # apps/mobile/package.json is enforced here (not just collected locally).
      - name: Mobile — unit tests (with coverage thresholds)
        working-directory: apps/mobile
        run: pnpm test --runInBand

      - name: OpenAPI snapshot drift
        run: cd apps/backend && pnpm run openapi:build-and-snapshot && git diff --exit-code -- openapi.json

      - name: OpenAPI documentation coverage ratchet
        run: pnpm --filter=backend run check:openapi-coverage

      - name: api-client endpoint drift
        run: node scripts/check-api-client-drift.mjs

      - name: Prisma migration immutability
        if: github.event_name == 'pull_request'
        # Diff against the PR's own base so develop-only migrations are
        # protected too (origin/main would report them as additions).
        run: node scripts/check-prisma-migration-immutability.mjs origin/${{ github.base_ref }}

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_ENABLE_COMMENTS: 'false'

      - name: Trivy filesystem scan (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          scanners: 'vuln'
          limit-severities-for-sarif: true
          exit-code: '1'
          ignore-unfixed: false
          trivyignores: '.trivyignore.yaml'
          skip-dirs: 'coverage,dist,node_modules,.next,**/coverage,**/dist,**/node_modules,**/.next'
          skip-files: 'coverage/**,dist/**,node_modules/**,.next/**,**/coverage/**,**/dist/**,**/node_modules/**,**/.next/**,apps/*/coverage/**,apps/*/dist/**'
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          version: 'v0.72.0'

      - name: Upload Trivy SARIF artifact
        if: always() && hashFiles('trivy-fs.sarif') != ''
        uses: actions/upload-artifact@v7
        with:
          name: merge-gate-trivy-fs-sarif
          path: trivy-fs.sarif
          if-no-files-found: error
          retention-days: 7

      - name: Lefthook pre-push (eslint + typecheck + multi-tenant guard)
        # Single source of truth: this is the SAME lefthook config that runs
        # locally before every `git push`. CI invokes the CLI directly so
        # there is no risk of the CI and local-hook behaviors drifting apart.
        # --all-files ensures we lint every changed path, not just the diff.
        # --no-TTY prevents lefthook from blocking on a missing TTY.
        run: |
          pnpm lefthook run pre-push --all-files --no-tty

      - name: Compose gate result
        if: success()
        run: |
          echo "✅ MERGE GATE PASSED for ${{ github.ref }}"
          echo "The candidate is releasable."
        shell: bash
      - name: Compose gate result (failure)
        if: failure()
        run: |
          echo "❌ MERGE GATE FAILED for ${{ github.ref }}"
          echo "See the failing step output above."
          echo "This PR cannot be merged until all checks pass."
        shell: bash

  # ─────────────────────────────────────────────────────────────────────
  # critical-real-e2e — backend real-database e2e lane (test:e2e:critical).
  # Runs against disposable Postgres and Redis services. Email-entry proof
  # limits use real Redis; external delivery/payment providers remain mocked.
  # ─────────────────────────────────────────────────────────────────────
  critical-real-e2e:
    name: critical-real-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: sawaa_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d sawaa_e2e_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/sawaa_e2e_test?schema=public
      REAL_E2E_DATABASE_URL: postgresql://test:test@localhost:5432/sawaa_e2e_test?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      REDIS_DB: '13'
      TZ: Asia/Riyadh
      # Hosted runners can default to a ~2 GiB heap; the 28-suite run needs more.
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @sawaa/shared --filter @sawaa/api-client build

      - name: Prisma generate + migrate test database
        working-directory: apps/backend
        run: pnpm run prisma:generate && pnpm run prisma:migrate:deploy

      - name: Backend — critical real-database e2e
        working-directory: apps/backend
        run: pnpm run test:e2e:critical

      - name: Upload critical e2e results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: critical-real-e2e-results
          path: apps/backend/test-results-critical.json
          if-no-files-found: ignore
          retention-days: 7
