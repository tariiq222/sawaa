# Release metadata only. A tag or GitHub Release is not proof of deployment.
name: release

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish release tag only
        id: tag
        run: node scripts/tag-release.mjs "$GITHUB_SHA"
      - name: Create GitHub release
        if: steps.tag.outputs.skipped == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          body: |
            Code release only. This entry does not establish successful deployment.
            See docs/operations/current-state.md for dated runtime verification and outstanding gates.
      - name: Summarize release
        if: steps.tag.outputs.skipped == 'false'
        env:
          TAGNAME: ${{ steps.tag.outputs.tag }}
        run: |
          printf 'Tagged code release **%s**. Deployment remains separately verified.\n' "$TAGNAME" >> "$GITHUB_STEP_SUMMARY"
