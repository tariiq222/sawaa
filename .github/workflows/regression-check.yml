# Regression Check — runs on every push to develop.
#
# This is the "after-merge" companion to merge-gate. PR-time tests
# (ci.yml) are fast but only cover the touched surface. Once code
# lands in develop, this workflow runs the full backend E2E + dashboard
# Playwright flows to surface regressions that the unit tests miss
# (e.g. cross-cutting features broken by a small change).
#
# Unlike the nightly-e2e suite, this runs on every push to develop
# (not just nightly) so we catch issues the same day.
#
# Schedule: 1 hour SLA per push. If it grows, split into:
#   - regression-backend (fast): unit + e2e backend
#   - regression-dashboard (slow): playwright flows
# and parallelize them.

name: regression-check

on:
  push:
    branches: [develop]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".github/workflows/regression-check.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-backend:
    name: regression-backend
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: sawaa_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter backend prisma:generate

      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin123 \
            quay.io/minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done

      - name: Run migrations
        run: pnpm --filter backend prisma:migrate:deploy

      - name: Seed database
        run: pnpm --filter backend db:seed

      - name: Backend — full e2e (smoke)
        run: pnpm --filter backend test:smoke

      - name: Backend — full e2e (network-mocked)
        run: pnpm --filter backend test:e2e

  regression-dashboard:
    name: regression-dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: sawaa_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @sawaa/shared --filter @sawaa/api-client build

      - name: Generate Prisma Client
        run: pnpm --filter backend prisma:generate

      - name: Install Playwright Chromium
        run: pnpm --filter dashboard exec playwright install --with-deps chromium

      - name: Run migrations + seed
        run: |
          pnpm --filter backend prisma:migrate:deploy
          pnpm --filter backend db:seed

      - name: Build + boot dashboard (Playwright webServer)
        env:
          PW_E2E_PROD: 1
        run: pnpm --filter dashboard exec playwright test --project=smoke

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-smoke-on-develop
          path: apps/dashboard/playwright-report
          retention-days: 14