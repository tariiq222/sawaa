# Run this file separately and explicitly after the coordinator accepts the
# existing migration-history and checksum review. It intentionally contains no
# application services, profiles, or depends_on clauses.
services:
  migrate:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    image: ${BACKEND_IMAGE:-sawaa-backend:staging}
    restart: "no"
    environment:
      NODE_ENV: ${NODE_ENV:-staging}
      # Owner/migration credential only. Never copy this into runtime backend.
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?MIGRATION_DATABASE_URL is required}
    command: ["npx", "prisma", "migrate", "deploy", "--schema=prisma/schema"]

networks:
  default:
    external: true
    name: ${RUNTIME_NETWORK:-openship-sawaa-staging}
