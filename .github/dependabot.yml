# Dependabot — automated dependency updates for pnpm workspaces.
#
# Per CLAUDE.md: pnpm overrides in package.json handle known CVEs manually,
# but Dependabot adds a second, continuous signal — PRs land weekly so we
# notice transitive bumps without re-running pnpm audit by hand.
#
# Every ecosystem targets `develop`: the deployment policy forbids PRs straight
# into `main` (docs/operations/deployment-policy.md). There is no
# github-actions ecosystem because GitHub Actions is disabled for this repo
# (CI runs on local Woodpecker), so workflow bumps would only pile up PRs.

version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    # Group patch + minor bumps so PR volume stays manageable.
    groups:
      patch-and-minor:
        update-types: ["minor", "patch"]
      major-versions:
        update-types: ["major"]
    # PR limits keep the queue reviewable.
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Standard ignore rules — same as Renovate defaults.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
        # Until v2 lands we don't want surprise majors.

  - package-ecosystem: "pip"
    directory: "/scripts/security"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
