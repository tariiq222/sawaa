name: Apple TestFlight

on:
  push:
    branches: [develop, main]
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - 'patches/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - 'scripts/apple-release/**'
      - '.github/workflows/apple-testflight.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# One existing app shares the Apple build-number sequence across both branches.
concurrency:
  group: sawaa-apple-testflight
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 150
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REF_NAME: ${{ github.ref_name }}
      GITHUB_SHA: ${{ github.sha }}
      OPENSHIP_READ_TOKEN: ${{ github.ref_name == 'main' && secrets.OPENSHIP_PRODUCTION_READ_TOKEN || secrets.OPENSHIP_STAGING_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify matching OpenShip deployment
        run: |
          APPLE_OUTPUT_DIR="$RUNNER_TEMP/sawaa-apple-output"
          echo "APPLE_OUTPUT_DIR=$APPLE_OUTPUT_DIR" >> "$GITHUB_ENV"
          mkdir -p "$APPLE_OUTPUT_DIR"
          node scripts/apple-release/deployment.mjs "$APPLE_OUTPUT_DIR/deployment.json"
      - name: Recover prior upload intent on rerun
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          intent=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "upload-intent") | .name')
          if [ -n "$intent" ]; then
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name upload-intent --dir "$APPLE_OUTPUT_DIR/recovery"
          fi
      - name: Restore existing Apple signing material
        env:
          P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          ASC_KEY_BASE64: ${{ secrets.APPLE_ASC_PRIVATE_KEY_BASE64 }}
          FIREBASE_BASE64: ${{ secrets.MOBILE_FIREBASE_IOS_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          private_dir=$(mktemp -d "$RUNNER_TEMP/sawaa-apple-private.XXXXXX")
          echo "APPLE_PRIVATE_DIR=$private_dir" >> "$GITHUB_ENV"
          PRIVATE_DIR="$private_dir" python3 - <<'PY'
          import os,base64,pathlib,re
          root=pathlib.Path(os.environ['PRIVATE_DIR'])
          values={'distribution.p12':'P12_BASE64','distribution.mobileprovision':'PROFILE_BASE64','firebase.plist':'FIREBASE_BASE64'}
          for name,key in values.items():
              if not os.environ[key]: raise ValueError('Missing existing signing secret: '+key)
              (root/name).write_bytes(base64.b64decode(os.environ[key],validate=True))
          key_id=os.environ['ASC_KEY_ID']
          if not re.fullmatch('[A-Z0-9]{10}',key_id): raise ValueError('Invalid ASC key ID')
          (root/('AuthKey_'+key_id+'.p8')).write_bytes(base64.b64decode(os.environ['ASC_KEY_BASE64'],validate=True))
          (root/'p12-password').write_text(os.environ['P12_PASSWORD'])
          with open(os.environ['GITHUB_ENV'],'a') as f:
              for k,v in {'APPLE_P12_PATH':root/'distribution.p12','APPLE_P12_PASSWORD_FILE':root/'p12-password','APPLE_PROFILE_PATH':root/'distribution.mobileprovision','FIREBASE_IOS_GOOGLE_SERVICES_FILE':root/'firebase.plist','APPLE_ASC_PRIVATE_KEY_PATH':root/('AuthKey_'+key_id+'.p8'),'API_PRIVATE_KEYS_DIR':root,'APPLE_ASC_KEY_ID':key_id,'APPLE_ASC_ISSUER_ID':os.environ['ASC_ISSUER_ID']}.items(): f.write(str(k)+'='+str(v)+'\n')
          PY
      - name: Allocate or resume exact Apple build
        id: apple
        run: node scripts/apple-release/apple.mjs allocate
      - uses: pnpm/action-setup@v4
        if: steps.apple.outputs.mode == 'build'
        with:
          version: '10.10.0'
      - uses: ruby/setup-ruby@v1
        if: steps.apple.outputs.mode == 'build'
        with:
          ruby-version: '3.4'
          bundler: '4.0.20'
      - name: Select Xcode 26.2
        if: steps.apple.outputs.mode == 'build'
        run: |
          test -d /Applications/Xcode_26.2.app
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version
      - name: Build and verify signed IPA
        if: steps.apple.outputs.mode == 'build'
        env:
          IOS_BUILD_NUMBER: ${{ steps.apple.outputs.build_number }}
        run: bash scripts/apple-release/build-ios.sh
      - name: Recheck deployment before upload
        run: node scripts/apple-release/deployment.mjs "$APPLE_OUTPUT_DIR/deployment-before-upload.json"
      - name: Persist intended binary identity
        if: steps.apple.outputs.mode == 'build'
        run: node scripts/apple-release/apple.mjs intent
      - uses: actions/upload-artifact@v4
        if: steps.apple.outputs.mode == 'build'
        with:
          name: upload-intent
          path: ${{ env.APPLE_OUTPUT_DIR }}/upload-intent.json
          retention-days: 90
          if-no-files-found: error
      - name: Upload once and verify Apple processing and group availability
        if: steps.apple.outputs.mode == 'build'
        env:
          APPLE_ALLOW_UPLOAD: '1'
        run: node scripts/apple-release/apple.mjs upload
      - name: Resume an observed Apple build
        if: steps.apple.outputs.mode == 'resume'
        run: node scripts/apple-release/apple.mjs resume
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-release-evidence-${{ github.run_attempt }}
          path: |
            ${{ env.APPLE_OUTPUT_DIR }}/deployment*.json
            ${{ env.APPLE_OUTPUT_DIR }}/binary-verification.json
            ${{ env.APPLE_OUTPUT_DIR }}/apple-release.json
            ${{ env.APPLE_OUTPUT_DIR }}/run.json
          retention-days: 90
          if-no-files-found: ignore
      - name: Remove temporary signing material
        if: always()
        run: |
          if [ -n "${APPLE_PRIVATE_DIR:-}" ]; then rm -rf "$APPLE_PRIVATE_DIR"; fi
