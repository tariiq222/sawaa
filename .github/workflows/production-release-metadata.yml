# Release metadata only. A tag or GitHub Release is not proof of deployment.
name: production-release-metadata

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string

concurrency:
  group: sawaa-production-release-metadata
  queue: max

jobs:
  tag:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.source_sha == github.sha
    name: tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish release tag only
        id: tag
        env:
          RELEASE_SHA: ${{ inputs.source_sha }}
        run: node scripts/tag-release.mjs "$RELEASE_SHA"
      - name: Generate release changelog
        if: steps.tag.outputs.skipped == 'false'
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        with:
          version: v2.14.2
          config: cliff.toml
          args: --current
        env:
          OUTPUT: RELEASE-NOTES.md
      - name: Create GitHub release
        if: steps.tag.outputs.skipped == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body_path: RELEASE-NOTES.md
          files: RELEASE-NOTES.md
      - name: Summarize release
        if: steps.tag.outputs.skipped == 'false'
        env:
          TAGNAME: ${{ steps.tag.outputs.tag }}
        run: |
          printf 'Tagged code release **%s**. Deployment remains separately verified.\n' "$TAGNAME" >> "$GITHUB_STEP_SUMMARY"
