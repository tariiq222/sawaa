services:
  postgres:
    build:
      context: ../..
      dockerfile: docker/openship/Postgres.Dockerfile
    image: ${POSTGRES_IMAGE:-sawaa-postgres:18-pgvector}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      APP_DB_USER: ${APP_DB_USER:?APP_DB_USER is required}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}
    volumes:
      - "${POSTGRES_DATA_PATH:?POSTGRES_DATA_PATH is required}:/var/lib/postgresql"
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - "${REDIS_DATA_PATH:?REDIS_DATA_PATH is required}:/data"
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    volumes:
      - "${MINIO_DATA_PATH:?MINIO_DATA_PATH is required}:/data"
    command: ["server", "/data", "--console-address", ":9001"]
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    image: ${BACKEND_IMAGE:-sawaa-backend:staging}
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "5100"
      BACKEND_URL: ${API_PUBLIC_URL:?API_PUBLIC_URL is required}
      DATABASE_URL: ${APP_DATABASE_URL:?APP_DATABASE_URL is required}
      # Backend-scoped owner URL; start-backend.sh passes it only to Prisma.
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?MIGRATION_DATABASE_URL is required}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-30000}
      DB_POOL_TIMEOUT_S: ${DB_POOL_TIMEOUT_S:-20}
      DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT:-10}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DB: ${REDIS_DB:-0}
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-sawaa}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      # Keep valid optional values in the environment; replace the internal
      # default when browser presigned URLs are part of the rehearsal.
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-minio}
      MINIO_PUBLIC_PORT: ${MINIO_PUBLIC_PORT:-9000}
      MINIO_PUBLIC_USE_SSL: ${MINIO_PUBLIC_USE_SSL:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
      MOBILE_REVIEW_CLIENT_ID: ${MOBILE_REVIEW_CLIENT_ID:-}
      JWT_CLIENT_ACCESS_SECRET: ${JWT_CLIENT_ACCESS_SECRET:?JWT_CLIENT_ACCESS_SECRET is required}
      JWT_CLIENT_ACCESS_TTL: ${JWT_CLIENT_ACCESS_TTL:-15m}
      JWT_CLIENT_REFRESH_TTL: ${JWT_CLIENT_REFRESH_TTL:-7d}
      JWT_OTP_SECRET: ${JWT_OTP_SECRET:?JWT_OTP_SECRET is required outside development/test}
      WEB_CHAT_ENABLED: "${WEB_CHAT_ENABLED:-false}"
      CHAT_GUEST_TOKEN_SECRET: ${CHAT_GUEST_TOKEN_SECRET:?CHAT_GUEST_TOKEN_SECRET is required}
      CHAT_MAX_MESSAGE_LENGTH: ${CHAT_MAX_MESSAGE_LENGTH:-4000}
      CHAT_RATE_LIMIT_PER_MINUTE: ${CHAT_RATE_LIMIT_PER_MINUTE:-20}
      CHAT_DAILY_TOKEN_BUDGET: ${CHAT_DAILY_TOKEN_BUDGET:-100000}
      CHAT_DAILY_TOKEN_BUDGET_PER_IP: ${CHAT_DAILY_TOKEN_BUDGET_PER_IP:-500000}
      CHAT_DAILY_TOKEN_BUDGET_GLOBAL: ${CHAT_DAILY_TOKEN_BUDGET_GLOBAL:-5000000}
      CHAT_GUEST_SESSION_DAYS: ${CHAT_GUEST_SESSION_DAYS:-30}
      RETENTION_CHAT_DAYS: ${RETENTION_CHAT_DAYS:-365}
      NOTIFICATION_OUTBOX_CAPTURE_ENABLED: "${NOTIFICATION_OUTBOX_CAPTURE_ENABLED:-false}"
      NOTIFICATION_OUTBOX_DELIVERY_ENABLED: "${NOTIFICATION_OUTBOX_DELIVERY_ENABLED:-false}"
      NOTIFICATION_OUTBOX_CUTOVER_AT: ${NOTIFICATION_OUTBOX_CUTOVER_AT:-}
      AI_PROVIDER_ENCRYPTION_KEY: ${AI_PROVIDER_ENCRYPTION_KEY:?AI_PROVIDER_ENCRYPTION_KEY is required}
      MOYASAR_ENCRYPTION_KEY: ${MOYASAR_ENCRYPTION_KEY:?MOYASAR_ENCRYPTION_KEY is required}
      SMS_PROVIDER_ENCRYPTION_KEY: ${SMS_PROVIDER_ENCRYPTION_KEY:?SMS_PROVIDER_ENCRYPTION_KEY is required}
      ZOOM_PROVIDER_ENCRYPTION_KEY: ${ZOOM_PROVIDER_ENCRYPTION_KEY:?ZOOM_PROVIDER_ENCRYPTION_KEY is required}
      EMAIL_PROVIDER_ENCRYPTION_KEY: ${EMAIL_PROVIDER_ENCRYPTION_KEY:?EMAIL_PROVIDER_ENCRYPTION_KEY is required}
      SMS_WEBHOOK_URL_BASE: ${SMS_WEBHOOK_URL_BASE:-}
      AUTHENTICA_API_KEY: ${AUTHENTICA_API_KEY:-}
      AUTHENTICA_BASE_URL: ${AUTHENTICA_BASE_URL:?AUTHENTICA_BASE_URL is required}
      AUTHENTICA_DEFAULT_TEMPLATE_ID: ${AUTHENTICA_DEFAULT_TEMPLATE_ID:-1}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_CLIENT_EMAIL: ${FCM_CLIENT_EMAIL:-}
      FCM_PRIVATE_KEY: ${FCM_PRIVATE_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:?OPENROUTER_BASE_URL is required}
      OPENROUTER_CHAT_MODEL: ${OPENROUTER_CHAT_MODEL:-deepseek/deepseek-v4-flash-0731}
      TENANT_ENFORCEMENT: ${TENANT_ENFORCEMENT:-off}
      DEFAULT_ORGANIZATION_ID: ${DEFAULT_ORGANIZATION_ID:-00000000-0000-0000-0000-000000000001}
      PUBLIC_WEBSITE_URL: ${PUBLIC_WEBSITE_URL:?PUBLIC_WEBSITE_URL is required}
      DASHBOARD_PUBLIC_URL: ${DASHBOARD_PUBLIC_URL:?DASHBOARD_PUBLIC_URL is required}
      API_PUBLIC_URL: ${API_PUBLIC_URL:?API_PUBLIC_URL is required}
      PLATFORM_SETTINGS_KEY: ${PLATFORM_SETTINGS_KEY:?PLATFORM_SETTINGS_KEY is required}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:?SUPER_ADMIN_PASSWORD is required}
      INTERNAL_METRICS_ALLOWED_IPS: ${INTERNAL_METRICS_ALLOWED_IPS:?INTERNAL_METRICS_ALLOWED_IPS is required}
      INTERNAL_METRICS_TOKEN: ${INTERNAL_METRICS_TOKEN:?INTERNAL_METRICS_TOKEN is required}
      THROTTLER_DISABLED: "${THROTTLER_DISABLED:-false}"
      MOBILE_OTP_FULL_BYPASS: "${MOBILE_OTP_FULL_BYPASS:-false}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    expose:
      - "5100"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5100/api/v1/health/ready >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    command: ["sh", "start-backend.sh"]

  dashboard:
    build:
      context: ../..
      dockerfile: apps/dashboard/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${DASHBOARD_API_URL:?DASHBOARD_API_URL is required}
    image: ${DASHBOARD_IMAGE:-sawaa-dashboard:staging}
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "5103"
      # next.config.mjs reads this at build time for the /api/proxy rewrite.
      NEXT_PUBLIC_API_URL: ${DASHBOARD_API_URL:?DASHBOARD_API_URL is required}
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "5103"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5103/',{signal:AbortSignal.timeout(5000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    command: ["node", "apps/dashboard/server.js"]

  website:
    build:
      context: ../..
      dockerfile: apps/website/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
        NEXT_PUBLIC_DEFAULT_ORG_ID: ${NEXT_PUBLIC_DEFAULT_ORG_ID:?NEXT_PUBLIC_DEFAULT_ORG_ID is required}
        NEXT_PUBLIC_WEB_CHAT_ENABLED: ${NEXT_PUBLIC_WEB_CHAT_ENABLED:-false}
    image: ${WEBSITE_IMAGE:-sawaa-website:staging}
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "5105"
      INTERNAL_API_URL: http://backend:5100/api/v1
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "5105"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5105/',{signal:AbortSignal.timeout(5000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    command: ["node", "apps/website/server.js"]

networks:
  default:
    external: true
    name: ${RUNTIME_NETWORK:-openship-sawaa-staging}
